name: CI/CD - RingAI Voice Caller Service

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  SERVICE_NAME: "ai-llm-service"

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies
        run: |
          uv sync --no-dev --frozen --inexact

      - name: Lint with flake8
        run: |
          uv run python -m pip install flake8
          uv run flake8 app

      - name: Type check with mypy
        run: |
          uv run python -m pip install mypy
          uv run mypy app

      - name: Run tests with pytest
        run: |
          uv run python -m pip install pytest pytest-asyncio
          uv run pytest

      - name: Build Docker image
        run: |
          docker build -t ${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: Test Docker image (healthcheck)
        run: |
          docker run -d --name ${{ env.SERVICE_NAME }}-test -p 8000:8000 ${{ env.SERVICE_NAME }}:${{ github.sha }}
          # Wait for container to start
          sleep 15
          curl -f http://localhost:8000/health
          docker logs ${{ env.SERVICE_NAME }}-test
          docker stop ${{ env.SERVICE_NAME }}-test
          docker rm ${{ env.SERVICE_NAME }}-test

  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    env:
      SERVICE_NAME: ${{ env.SERVICE_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add SSH known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy project to dev server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='data' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_DEPLOY_PATH }}

      - name: Build & restart service on dev server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          set -e
          cd ${{ secrets.SSH_DEPLOY_PATH }}

          # Build Docker image on server
          docker build -t ${{ env.SERVICE_NAME }}:latest .

          # Stop and remove existing container if running
          if [ "$(docker ps -q -f name=${{ env.SERVICE_NAME }})" ]; then
            docker stop ${{ env.SERVICE_NAME }}
            docker rm ${{ env.SERVICE_NAME }}
          fi

          # Run new container
          docker run -d \
            --name ${{ env.SERVICE_NAME }} \
            -p 8000:8000 \
            --env-file .env \
            ${{ env.SERVICE_NAME }}:latest

          # Health check
          sleep 15
          curl -f http://localhost:8000/health
          EOF

      - name: Cleanup old Docker images on dev server (optional)
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          docker image prune -f
          EOF



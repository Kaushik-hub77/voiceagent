name: CI/CD - Cumma API (Develop)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package (editable mode)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Lint (optional)
        run: |
          pip install flake8
          flake8 app || true

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync project to EC2
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='venv' \
            ./ \
            ec2-user@${{ secrets.SSH_HOST }}:/home/ec2-user/cumma-voice-caller

      - name: Install & Restart PM2
        run: |
          ssh ec2-user@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /home/ec2-user/cumma-voice-caller

            # Activate virtualenv
            source venv/bin/activate

            # Upgrade pip
            pip install --upgrade pip

            # Install project in editable mode
            pip install -e .

            # Restart PM2 process
            pm2 restart cumma-api
            pm2 save

            echo "Deployment successful"
          EOF
# ============================================================
# LLM Model Configuration
# ============================================================
# This is the central configuration file for all LLM models
# and their usage across the application.
# ============================================================

default_model: "gpt-3.5-turbo"

# ============================================================
# Pipeline-Specific Model Selection
# ============================================================
# Define which models to use for specific pipelines based on
# their requirements (reasoning, context length, cost, etc.)
pipeline_models:
  draft_assistance:
    primary: "gpt-4"
    fallback: "gpt-4-turbo"
    reason: "Needs strong reasoning and creative suggestions"
    
  bias_checker:
    primary: "gpt-4"
    fallback: "gpt-3.5-turbo"
    reason: "Requires careful analysis and consistent evaluation"

  # Bias checker sub-stages (performance optimization + clearer routing)
  # - explain: keep higher-quality model
  # - rewrite/language: use faster model
  bias_checker_explain:
    primary: "gpt-4"
    fallback: "gpt-4-turbo"
    reason: "Human-readable explanations must be accurate and well-reasoned"

  bias_checker_rewrite:
    primary: "gpt-4o-mini"
    fallback: "gpt-3.5-turbo"
    reason: "Rewrites are short/structured; prioritize latency"

  bias_checker_language:
    primary: "gpt-4o-mini"
    fallback: "gpt-3.5-turbo"
    reason: "Language-only phrase extraction; prioritize latency"
    
  review_summarizer:
    primary: "gpt-4.1"
    fallback: "gpt-4.1"
    reason: "Can handle longer contexts from multiple reviews"
    
  general:
    primary: "gpt-4-turbo"
    fallback: "gpt-3.5-turbo"
    reason: "Default for general-purpose tasks"

# ============================================================
# Model Definitions
# ============================================================
models:
  gpt-5.1:
    provider: openai
    name: gpt-5.1
    context_window: 200000
    max_tokens: 4096
    input_cost_per_token: 0.00001
    output_cost_per_token: 0.00003
    capabilities:
      - text_generation
      - code_generation
      - analysis
      - long_context


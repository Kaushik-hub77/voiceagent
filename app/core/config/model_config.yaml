# ============================================================
# Pipeline-Specific LLM Configurations
# ============================================================
# Fine-tuned parameters for each pipeline type
pipeline_configs:
  draft_assistance:
    temperature: 0.2
    max_tokens: 2000
    top_p: 0.85
    description: "Very low temperature for strict tone adherence and consistent output"
    
  bias_checker:
    temperature: 0.1
    max_tokens: 1500
    top_p: 0.8
    description: "Very low temperature for consistent analysis"

  # Bias checker sub-stages use the same baseline config, with rewrites slightly shorter.
  bias_checker_explain:
    temperature: 0.2
    max_tokens: 1500
    top_p: 0.8
    description: "Explanations: low temperature, moderately sized outputs"

  bias_checker_rewrite:
    temperature: 0.3
    max_tokens: 600
    top_p: 0.9
    description: "Rewrites: concise, faster outputs"

  bias_checker_language:
    temperature: 0.2
    max_tokens: 1200
    top_p: 0.8
    description: "Language extraction: structured JSON with phrase lists"
    
  review_summarizer:
    temperature: 0.2
    max_tokens: 2500
    top_p: 0.9
    description: "Low temperature for consistent summaries"
    
  general:
    temperature: 0.7
    max_tokens: 2000
    top_p: 0.95
    description: "Balanced settings for general tasks"

# ============================================================
# Provider Configurations
# ============================================================
providers:
  openai:
    base_url: "https://api.openai.com/v1"
    timeout: 60
    retry_attempts: 3
    backoff_factor: 2

  anthropic:
    base_url: "https://api.anthropic.com"
    timeout: 60
    retry_attempts: 3
    backoff_factor: 2

  google:
    base_url: "https://generativelanguage.googleapis.com"
    timeout: 60
    retry_attempts: 3
    backoff_factor: 2
